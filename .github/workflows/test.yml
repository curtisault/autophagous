name: Test

# Pull requests only. `deploy.yml` already gates main on the same
# suite, so running this on push as well would double every run for
# no extra signal.
on:
  pull_request:

# Least privilege: this job reads the tree and reports a status. It
# touches nothing else.
permissions:
  contents: read

# A force-push supersedes whatever was already running for that PR.
# Cancel it rather than paying for a result nobody will read.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # MUST come before mise-action. elm-test-rs is installed from a
      # git fork through the cargo backend, which compiles it from
      # source (~40 s plus the dependency crates). Restoring this cache
      # is what stops every CI run paying that. Keyed on mise.toml, so
      # changing any pin rebuilds.
      - name: Cache mise tools
        uses: actions/cache@v4
        with:
          path: ~/.local/share/mise
          key: mise-${{ runner.os }}-${{ hashFiles('mise.toml') }}

      # The entire toolchain — deno, elm, elm-test-rs, typst — comes
      # from mise.toml, which is the only place any version is written
      # down. There is no node: Deno is the only JS runtime.
      - uses: jdx/mise-action@v2

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}

      # Not needed by the test runner, which drives the elm compiler
      # directly. This stays so a broken deno.json or deno.lock fails
      # on the PR rather than surfacing later at the deploy build.
      - run: deno install

      - name: Cache Elm packages
        uses: actions/cache@v4
        with:
          path: ~/.elm
          key: elm-${{ hashFiles('elm.json') }}

      - run: deno task test
