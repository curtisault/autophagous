name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # MUST come before mise-action. elm-test-rs is installed from a
      # git fork through the cargo backend, which compiles it from
      # source (~40 s plus the dependency crates). Restoring this cache
      # is what stops every CI run paying that. Keyed on mise.toml, so
      # changing any pin rebuilds.
      - name: Cache mise tools
        uses: actions/cache@v4
        with:
          path: ~/.local/share/mise
          key: mise-${{ runner.os }}-${{ hashFiles('mise.toml') }}

      # The entire toolchain — deno, elm, elm-test-rs, typst — comes
      # from mise.toml, which is the only place any version is written
      # down. There is no node anywhere: Deno is the only JS runtime,
      # for the build and for the test bundle alike.
      - uses: jdx/mise-action@v2

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}

      # Needed for the build (vite + vite-plugin-elm). The test gate
      # below does not depend on it.
      - run: deno install

      - name: Cache Elm packages
        uses: actions/cache@v4
        with:
          path: ~/.elm
          key: elm-${{ hashFiles('elm.json') }}

      # The gate. Never remove; add further gates as run steps above
      # the deploy, never below it. Exits non-zero on any failing test.
      - run: deno task test

      - run: deno task build

      # Guard a real Cloudflare Pages failure mode: a missing 404.html
      # re-enables the SPA fallback, which answers absent hashed assets
      # with index.html as 200 text/html — strict-MIME refuses it and
      # the immutable header then pins that mistake for a year.
      # Cheap to assert, expensive to discover in production.
      - name: Assert the SPA fallback stays off
        run: |
          test -f dist/404.html \
            || { echo "::error::dist/404.html missing — Pages would turn the SPA fallback back on (docs/DEPLOY.md)"; exit 1; }
          grep -q '^/\* ' dist/_redirects \
            && { echo "::error::wildcard rule in _redirects — reinstates the SPA-fallback MIME failure (docs/DEPLOY.md)"; exit 1; }
          echo "404.html present, no wildcard redirect"

      # NOTE: this action runs Node internally — it is a JavaScript
      # GitHub Action, and that is its own implementation detail, not
      # part of this project's toolchain. Nothing in `mise.toml`,
      # `deno.json`, or the build path uses node. If you want the
      # deploy on Deno too, `deno task deploy` does the same thing
      # with CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID in env —
      # wrangler runs fine under Deno. Kept on the action because it
      # is the battle-tested path and the one step CI cannot rehearse.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=autophagous

      # Purge the zone cache so no edge location keeps serving stale
      # HTML after a deploy. No-op until CLOUDFLARE_ZONE_ID is added as
      # a repo secret and the API token gains Zone → Cache Purge →
      # Purge, so it is safe to merge before either exists.
      - name: Purge zone cache
        env:
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_ZONE_ID" ]; then
            echo "CLOUDFLARE_ZONE_ID not set — skipping zone purge"
            exit 0
          fi
          curl -sf -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
