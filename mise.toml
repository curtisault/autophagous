# Project toolchain — install with `mise install`.
#
# - node: keep in step with any future CI workflow
# - elm: must stay on the 0.19.1 line (elm-test 0.19.1 runner pin);
#   the `elm` devDependency in package.json pins what node_modules
#   resolves
# - typst: compiles the printable artifacts (typst/*.typ) into
#   public/downloads/ via `npm run print`

[tools]
node = "26"
elm = "0.19.1"
typst = "latest"
