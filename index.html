<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- The two faces that are on screen before anything is scrolled:
         the masthead/labels (display) and the § marks and numerals
         (data). Served from public/fonts, so these paths are stable —
         Vite copies public/ verbatim and does not hash it. `crossorigin`
         is required even same-origin: fonts are fetched in CORS mode,
         and without it the preload is discarded and fetched twice. -->
    <link
      rel="preload"
      href="/fonts/archivo-expanded-700-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>AUTOPHAGOUS — DEMOLITION AND REBUILD</title>
    <meta
      name="description"
      content="A cycle-based field manual for maximising autophagic signalling through prolonged fasting: priming, the fast, the refeed, the rebuild."
    />
  </head>
  <body>
    <!-- No mount node: Browser.application takes the body. The <title>
         above is pre-boot only — Route.title owns it once Elm starts. -->
    <script type="module" src="/src/boot.js"></script>
  </body>
</html>
